name: Agencia / Evidencia visual BETA
on:
  push:
    branches: [ci/agency-quality-gate]
    paths:
      - scripts/capture-visuals.cjs
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Instalar Playwright
        run: npm install --no-save @playwright/test@1.58.2
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Capturar escritorio, tablet, móvil y menú
        run: node scripts/capture-visuals.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: black-barber-visual-22032ca1
          path: visual-review/
          if-no-files-found: error
          retention-days: 30
      - name: Crear copias revisables de capturas en rama de PR
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visual-review/
          if ! git diff --cached --quiet; then
            git commit -m 'test: provide temporary screenshots for visual audit'
            git push origin HEAD:ci/agency-quality-gate
          fi
