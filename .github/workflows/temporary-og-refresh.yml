name: Agencia / Regenerar OG (temporal)
on:
  push:
    branches: [ci/agency-quality-gate]
    paths:
      - scripts/render_og.py

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Crear entorno de imagen
        run: |
          python3 -m venv /tmp/barber-og
          /tmp/barber-og/bin/pip install --disable-pip-version-check Pillow==12.0.0
      - name: Generar PNG Open Graph de alta calidad
        run: /tmp/barber-og/bin/python scripts/render_og.py
      - name: Guardar únicamente la imagen en la rama de pruebas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add black-barber-og.png
          if ! git diff --cached --quiet; then
            git commit -m 'fix: regenerate crisp anti-aliased Open Graph image'
            git push origin HEAD:ci/agency-quality-gate
          fi
