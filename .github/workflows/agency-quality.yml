name: Agencia / Calidad BETA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: barber-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validar sintaxis del control de publicación
        run: python3 -m py_compile .github/scripts/verify-release.py
      - name: Instalar herramientas de prueba
        run: npm install --no-save @playwright/test@1.58.2
      - name: Pruebas de escritorio y móvil
        run: npx playwright test tests/demo.spec.cjs --reporter=line
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: barber-test-results
          path: test-results/
          if-no-files-found: ignore
